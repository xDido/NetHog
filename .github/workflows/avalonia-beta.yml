name: Cross-platform desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - linux-beta
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build NetHog
        run: dotnet publish src/NetHog/NetHog.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -o artifacts/NetHog-${{ matrix.runtime }}

      - name: Build the solution on Windows
        if: matrix.os == 'windows-latest'
        run: dotnet build NetHog.sln -c Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NetHog-${{ matrix.runtime }}
          path: artifacts/NetHog-${{ matrix.runtime }}
          if-no-files-found: error
