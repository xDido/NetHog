name: Windows packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the portable EXE and MSI
        shell: pwsh
        env:
          NETHOG_CODESIGN_PFX_BASE64: ${{ secrets.NETHOG_CODESIGN_PFX_BASE64 }}
          NETHOG_CODESIGN_PFX_PASSWORD: ${{ secrets.NETHOG_CODESIGN_PFX_PASSWORD }}
          NETHOG_CODESIGN_TIMESTAMP_URL: ${{ secrets.NETHOG_CODESIGN_TIMESTAMP_URL }}
        run: .\installer\build-msi.ps1

      - name: Sign release archive
        shell: pwsh
        env:
          NETHOG_UPDATE_SIGNING_KEY: ${{ secrets.NETHOG_UPDATE_SIGNING_KEY }}
        run: .\installer\sign-release.ps1

      - name: Upload single Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: NetHog-win-x64
          path: |
            artifacts/release-v*.zip
            artifacts/release-v*.zip.sig
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release-v*.zip
            artifacts/release-v*.zip.sig
